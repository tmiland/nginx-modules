name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out release tag
        run: |
          [[ "$TAG" =~ ^v[0-9] ]] || { echo "tag must start with v: $TAG" >&2; exit 1; }
          git fetch --tags --force origin
          git checkout --force "$TAG"

      - name: Build full bundle
        run: bash scripts/build_bundle.sh --bundle full

      - name: Verify checksums
        run: (cd dist && sha256sum -c SHA256SUMS)

      - name: Create release
        run: |
          gh release create "$TAG" \
            dist/nginx-modules-full.tar.gz \
            dist/SHA256SUMS \
            --verify-tag \
            --title "$TAG" \
            --generate-notes
