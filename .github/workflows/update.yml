name: Update check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check upstream drift
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/update-modules.sh --check
